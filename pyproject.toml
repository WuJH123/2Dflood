[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrograph-operator"
version = "0.1.0"
description = "Physics-constrained heterogeneous graph operator for transferable urban flood-field simulation on UrbanFloodBench."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "2Dflood contributors"}]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "PyYAML>=6.0",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
plot = ["matplotlib>=3.8"]

[project.scripts]
hydrograph = "hydrograph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
