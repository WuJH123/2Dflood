name: Bootstrap research source

on:
  push:
    branches:
      - feat/initial-research-code

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect bootstrap payload
        id: payload
        shell: bash
        run: |
          if [ -f .bootstrap/part00.b64 ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize repository source
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import tarfile

          parts = [
              '.bootstrap/part00.b64',
              '.bootstrap/part01a0.b64',
              '.bootstrap/part01a10.b64',
              '.bootstrap/part01a11.b64',
              '.bootstrap/part01a2.b64',
              '.bootstrap/part01b.b64',
              '.bootstrap/part01c.b64',
              '.bootstrap/part01d.b64',
              '.bootstrap/part02.b64',
              '.bootstrap/part03.b64',
              '.bootstrap/part04.b64',
          ]
          payload = ''.join(Path(p).read_text(encoding='utf-8') for p in parts)
          raw = base64.b64decode(payload, validate=True)
          digest = hashlib.sha256(raw).hexdigest()
          expected = 'd3bc279291401c95190d93b6f8629bffd5563047161f1a5870b142d5bde3ea9a'
          if digest != expected:
              raise RuntimeError(f'bootstrap archive checksum mismatch: {digest} != {expected}')
          archive = Path('/tmp/2dflood_repo.tar.gz')
          archive.write_bytes(raw)
          with tarfile.open(archive, 'r:gz') as tf:
              tf.extractall('.')
          PY
          rm -rf .bootstrap
          # Actions' GITHUB_TOKEN cannot create/update workflow files. Keep this
          # bootstrap workflow unchanged and let the authenticated GitHub connector
          # install the final CI workflow after the source commit lands.
          rm -f .github/workflows/ci.yml

      - name: Commit materialized source
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add transferable urban flood graph operator"
          git push origin HEAD:feat/initial-research-code
