name: Bootstrap research source

on:
  push:
    branches:
      - feat/initial-research-code

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect bootstrap payload
        id: payload
        shell: bash
        run: |
          if [ -f .bootstrap/part00.b64 ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize repository source
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part*.b64 > /tmp/2dflood_repo.b64
          base64 --decode /tmp/2dflood_repo.b64 > /tmp/2dflood_repo.tar.gz
          tar -xzf /tmp/2dflood_repo.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml

      - name: Commit materialized source
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add transferable urban flood graph operator"
          git push origin HEAD:feat/initial-research-code
